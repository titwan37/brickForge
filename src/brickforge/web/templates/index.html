<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrickForge — Sovereign Code Brick Explorer</title>
  <script>
    // Immediate early theme application to eliminate flash of light theme
    (function () {
      const savedTheme = localStorage.getItem('afa-global-theme') || 'system';
      let theme = savedTheme;
      if (theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-theme-setting', savedTheme);
    })();
  </script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked.js for Markdown Chat Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- PrismJS for Syntax Highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <!-- Alpine.js Collapse Plugin -->
  <script defer src="https://unpkg.com/@alpinejs/collapse@3.14.8/dist/cdn.min.js"></script>
  <!-- Alpine.js Core -->
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <script>
  // To support both standalone local dev (http://127.0.0.1:8000/) and subpath deployment (https://afastudio.ch/brickforge/), 
  // we can dynamically determine the API base prefix  
  // Detect if running under /brickforge/ subpath or root /
  const API_BASE = window.location.pathname.startsWith('/brickforge') ? '/brickforge' : '';
  // e.g. fetch(`${API_BASE}/api/stats`)

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    /* Light Theme (Default) */
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    /* Dark Theme (Day / Night sync with afastudio & hub) */
    html.dark {
      color-scheme: dark;
    }
    html.dark body {
      background-color: #0b0f19 !important;
      color: #f1f5f9 !important;
    }
    html.dark header {
      background-color: rgba(15, 23, 42, 0.95) !important;
      border-color: #1e293b !important;
    }
    html.dark .bg-white {
      background-color: #111827 !important;
      border-color: #1f2937 !important;
      color: #f8fafc !important;
    }
    html.dark .bg-slate-50 {
      background-color: #1e293b !important;
      color: #e2e8f0 !important;
    }
    html.dark .bg-slate-100 {
      background-color: #1e293b !important;
      color: #cbd5e1 !important;
    }
    html.dark .border-slate-200,
    html.dark .border-slate-200\/90,
    html.dark .border-slate-100 {
      border-color: #1e293b !important;
    }
    html.dark .text-slate-900,
    html.dark .text-slate-800 {
      color: #f8fafc !important;
    }
    html.dark .text-slate-700,
    html.dark .text-slate-600 {
      color: #cbd5e1 !important;
    }
    html.dark .text-slate-500,
    html.dark .text-slate-400 {
      color: #94a3b8 !important;
    }
    html.dark input,
    html.dark textarea,
    html.dark select {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #334155 !important;
    }
    html.dark .prose-chat h3 { color: #f8fafc !important; }
    html.dark .prose-chat h4 { color: #e2e8f0 !important; }
    html.dark .prose-chat code:not(pre code) { background: #1e293b; color: #38bdf8; }

    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Markdown chat styles */
    .prose-chat h3 { font-size: 0.95rem; font-weight: 700; margin-top: 0.6rem; margin-bottom: 0.3rem; color: #0f172a; }
    .prose-chat h4 { font-size: 0.85rem; font-weight: 600; margin-top: 0.5rem; margin-bottom: 0.25rem; color: #1e293b; }
    .prose-chat p { margin-top: 0.35rem; margin-bottom: 0.35rem; line-height: 1.5; }
    .prose-chat ul, .prose-chat ol { margin-left: 1.2rem; margin-top: 0.3rem; margin-bottom: 0.3rem; list-style-type: disc; }
    .prose-chat li { margin-bottom: 0.2rem; }
    .prose-chat code:not(pre code) { background: #f1f5f9; color: #0284c7; padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.75rem; font-family: "JetBrains Mono", monospace; }
    .prose-chat pre { background: #0f172a !important; color: #f8fafc; border-radius: 0.75rem; padding: 0.75rem; margin-top: 0.5rem; margin-bottom: 0.5rem; overflow-x: auto; font-size: 0.75rem; font-family: "JetBrains Mono", monospace; }
    .prose-chat blockquote { border-left: 3px solid #3b82f6; padding-left: 0.6rem; margin-top: 0.4rem; margin-bottom: 0.4rem; color: #475569; font-style: italic; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans antialiased min-h-screen flex flex-col" x-data="brickExplorer()" x-init="initData()">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Left: Logo & Navigation Links -->
      <div class="flex items-center gap-8">
        <a href="/" @click.prevent="switchView('catalog')" class="flex items-center gap-2.5 group cursor-pointer">
          <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-xl shadow-sm shadow-blue-500/30 group-hover:bg-blue-700 transition">
            <i data-lucide="blocks" class="w-5 h-5"></i>
          </div>
          <div>
            <span class="text-lg font-bold tracking-tight text-slate-900 group-hover:text-blue-600 transition">BRICKFORGE</span>
            <span class="hidden sm:inline-block ml-1 text-[10px] font-semibold uppercase tracking-wider text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-200">CATALOG</span>
          </div>
        </a>

        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">

          <button 
            @click="switchView('chat')" 
            :class="currentView === 'chat' ? 'text-blue-600 font-semibold flex items-center gap-1.5' : 'text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5 cursor-pointer'"
          >
            <i data-lucide="bot" class="w-4 h-4 text-blue-500"></i>
            <span>AI Architect</span>
            <span 
              class="w-2 h-2 rounded-full" 
              :class="isOllamaOnline ? 'bg-emerald-500 animate-pulse' : 'bg-amber-400'"
              :title="isOllamaOnline ? 'Ollama Online' : 'Local RAG Active'"
            ></span>
            <span 
              x-show="isChatLoading" 
              class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-700 animate-pulse flex items-center gap-1"
            >
              <i data-lucide="loader-2" class="w-2.5 h-2.5 animate-spin"></i>
              <span>Generating...</span>
            </span>
          </button>

          <button 
            @click="switchView('catalog')" 
            :class="currentView === 'catalog' ? 'text-blue-600 font-semibold flex items-center gap-1.5' : 'text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5 cursor-pointer'"
          >
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
            <span>Browse Catalog</span>
            <span x-show="currentView === 'catalog'" class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
          </button>


          <a href="#stats" @click.prevent="openStatsModal = true" class="hover:text-slate-900 transition flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="database" class="w-4 h-4 text-slate-400"></i>
            <span>Database Stats</span>
          </a>

          <a href="https://github.com" target="_blank" class="hover:text-slate-900 transition flex items-center gap-1">
            Documentation <i data-lucide="external-link" class="w-3.5 h-3.5 text-slate-400"></i>
          </a>
        </nav>
      </div>

      <!-- Center / Right: Global Search & Actions -->
      <div class="flex items-center gap-3 flex-1 max-w-md justify-end">
        <div class="relative w-full max-w-sm hidden sm:block">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
          </div>
          <input 
            type="text" 
            x-model="searchQuery" 
            @input.debounce.300ms="fetchBricks(1)"
            @keydown.window.prevent.slash="$el.focus()"
            placeholder="Search bricks, signatures, creators...  /"
            class="w-full pl-9 pr-9 py-1.5 text-sm bg-slate-100 hover:bg-slate-50 focus:bg-white border border-transparent focus:border-blue-500 rounded-full transition outline-none text-slate-800 placeholder-slate-400 shadow-inner"
          />
          <button 
            x-show="searchQuery" 
            @click="searchQuery = ''; fetchBricks(1)" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
          >
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <div class="flex items-center gap-2">
          <!-- Global Theme Toggle (Day & Night) -->
          <button 
            type="button"
            @click="toggleTheme()" 
            class="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-50 transition"
          >
            <i data-lucide="sun" class="w-4 h-4"></i>
          </button>

          <!-- Project/Folder Registration -->
          <button 
            @click="registerProject" 
            class="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-50 transition"
          >
            <i data-lucide="folder-plus" class="w-4 h-4"></i>
          </button>

          <!-- Code/Docs Toggles -->
          <button 
            @click="toggleCodeDocs" 
            class="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-50 transition"
          >
            <i data-lucide="code" class="w-4 h-4"></i>
          </button>

          <!-- Indexing Status -->
          <span 
            class="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-50 transition"
          >
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
          </span>

          <!-- Create/Resume/Archive Controls -->
          <button 
            @click="createSession" 
            class="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-50 transition"
          >
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>

          <button 
            @click="resumeSession" 
            class="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-50 transition"
          >
            <i data-lucide="play" class="w-4 h-4"></i>
          </button>

          <button 
            @click="archiveSession" 
            class="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-50 transition"
          >
            <i data-lucide="archive" class="w-4 h-4"></i>
          </button>

          <!-- Active-Session Indicator -->
          <span 
            class="p-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-50 transition"
          >
            <i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i>
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 p-4">
    <div x-show="currentView === 'catalog'" class="flex flex-col">
      <h1 class="text-2xl font-bold mb-4">Catalog</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Catalog items will be dynamically loaded here -->
      </div>
    </div>

    <div x-show="currentView === 'chat'" class="flex flex-col">
      <h1 class="text-2xl font-bold mb-4">Chat</h1>
      <div class="flex-1 overflow-y-auto">
        <div class="prose-chat" x-ref="chatContainer">
          <!-- Chat messages will be dynamically loaded here -->
        </div>
      </div>
      <div class="mt-4">
        <textarea x-model="chatInput" @keydown.enter="sendMessage" class="w-full p-2 border border-slate-200 rounded"></textarea>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-50 text-slate-600 text-center py-4">
    <p>&copy; 2023 BrickForge. All rights reserved.</p>
  </footer>

  <script>
    function brickExplorer() {
      return {
        currentView: 'catalog',
        searchQuery: '',
        chatInput: '',
        isOllamaOnline: true,
        isChatLoading: false,
        switchView(view) {
          this.currentView = view;
        },
        toggleTheme() {
          const savedTheme = localStorage.getItem('afa-global-theme') || 'system';
          let theme = savedTheme;
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            theme = theme === 'dark' ? 'light' : 'dark';
          }
          localStorage.setItem('afa-global-theme', theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-setting', theme);
        },
        registerProject() {
          // Logic to register a new project/folder
        },
        toggleCodeDocs() {
          // Logic to toggle between code and docs view
        },
        createSession() {
          // Logic to create a new session
        },
        resumeSession() {
          // Logic to resume an existing session
        },
        archiveSession() {
          // Logic to archive a session
        },
        sendMessage() {
          if (this.chatInput.trim()) {
            const message = this.chatInput.trim();
            this.chatInput = '';
            // Logic to send a message
          }
        }
      };
    }
  </script>
</body>
</html>
